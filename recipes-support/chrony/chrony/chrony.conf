# GPS time via gpsd SOCK interface (coarse, used to discipline PPS)
refclock SOCK /var/run/chrony.ttyAMA0.sock refid GPS

# PPS directly from kernel
refclock PPS /dev/pps0 refid PPS precision 1e-9 lock GPS

# Load additional source files from /etc/chrony/sources.d/
sourcedir /etc/chrony/sources.d

# Step the clock on the first three updates if offset > 1 s
makestep 0.1 -1

# Record clock drift for faster convergence after reboot
driftfile /var/lib/chrony/drift

# Log directory
logdir /var/log/chrony
